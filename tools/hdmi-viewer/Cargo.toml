[package]
name = "hdmi-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit", "persistence"] }
env_logger = { version = "0.11", default-features = false }
log = "0.4.34"
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"] }
serde = { version = "1.0.229", features = ["derive"] }
turbojpeg = { version = "1", default-features = false, features = ["cmake"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
