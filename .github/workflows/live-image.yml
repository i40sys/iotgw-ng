# live-image — build, test and publish the live provisioning tooling
# (the single `iotgw` binary, Go; live-image/README.md, decision-031/032).
# The installed-OpenWRT install playbook fetches iotgw-openwrt-linux-amd64.tar.gz from the
# GitHub release of a pinned tag (iotgw-kestra d01_install_owrt.yml).
#
# Every run: gofmt/vet/tests (`just check`) and a full `just dist`
# (linux/amd64 + linux/arm64 static binaries, rootfs overlay tarballs,
# SHA256SUMS), uploaded as a workflow artifact.
# Pushes (not PRs): signed SLSA build provenance for every artifact.
# v* tags: the artifacts are attached to the GitHub release of that tag.
name: live-image

on:
  push:
    branches: [main]
    tags: ["v*"] # path filters are not evaluated for tag pushes: every release builds
    paths:
      - "live-image/**"
      - "deploy/k8s/base/netboot/**"
      - ".github/workflows/live-image.yml"
  pull_request:
    paths:
      - "live-image/**"
      - "deploy/k8s/base/netboot/**"
      - ".github/workflows/live-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release (tags only)
      id-token: write # keyless signing of the provenance
      attestations: write
    defaults:
      run:
        working-directory: live-image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `git describe --tags` stamps the version

      - uses: actions/setup-go@v5
        with:
          go-version-file: live-image/go.mod
          cache-dependency-path: live-image/go.sum

      - uses: extractions/setup-just@v3

      - name: Check (gofmt, vet, tests)
        run: just check

      - name: Build release artifacts
        run: just dist

      - name: Version
        id: version
        run: echo "version=$(just version)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            live-image/dist/iotgw-linux-*
            live-image/dist/iotgw-live-overlay-linux-*.tar.gz
            live-image/dist/iotgw-openwrt-linux-*.tar.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iotgw-live-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            live-image/dist/iotgw-linux-*
            live-image/dist/iotgw-live-overlay-linux-*.tar.gz
            live-image/dist/iotgw-openwrt-linux-*.tar.gz
            live-image/dist/remove.list
            live-image/dist/SHA256SUMS

      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          release_notes="../deploy/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$release_notes" ]; then
              gh release edit "$TAG" --notes-file "$release_notes"
            fi
          elif [ -f "$release_notes" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$release_notes"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" --clobber \
            dist/iotgw-linux-* \
            dist/iotgw-live-overlay-linux-*.tar.gz dist/iotgw-openwrt-linux-*.tar.gz dist/remove.list dist/SHA256SUMS

  # End-to-end test of the installed-OpenWRT agent (decision-032, task-125.11):
  # two OpenWRT x86-64 VMs under QEMU/KVM — route repair, router change,
  # LAN→VPN fallback and return, hold, policy across reboot, vpn/ssh refresh
  # with rollback, console dashboard. See live-image/test/qemu/run.sh.
  # Bootable live image (task-149.01): pinned upstream Clonezilla + the overlay,
  # no SSH keys, boot-tested under QEMU. v* tags publish it to ghcr as an OCI
  # artifact (oras) pinned by digest, served by the OVH netboot (task-149.02).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # attach the artifact reference to the release (tags only)
      packages: write # oras push to ghcr.io/i40sys/iotgw-live-image
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: live-image
    env:
      IMAGE_CACHE: ${{ github.workspace }}/.image-cache
      OCI_REPO: ghcr.io/i40sys/iotgw-live-image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: live-image/go.mod
          cache-dependency-path: live-image/go.sum
      - uses: extractions/setup-just@v3
      - name: Cache pinned upstream inputs
        uses: actions/cache@v4
        with:
          path: .image-cache
          key: live-image-inputs-${{ hashFiles('live-image/image/pins.env') }}
      - name: Build the image
        run: just image amd64
      - name: QEMU + KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot test
        run: just image-test amd64
      - name: No SSH key material in what the netboot serves (menu + config)
        run: image/check-no-keys.sh ../deploy/k8s/base/netboot
      - name: Boot log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-image-boot-log
          path: /tmp/iotgw-live-boot-serial.log
      - uses: oras-project/setup-oras@v1
        if: github.ref_type == 'tag'
      - name: Publish OCI artifact
        if: github.ref_type == 'tag'
        id: oci
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd dist/image-amd64
          oras push "$OCI_REPO:${TAG#v}" \
            --artifact-type application/vnd.i40sys.iotgw.live-image.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.version=$TAG" \
            --format json \
            vmlinuz:application/octet-stream initrd:application/octet-stream \
            filesystem.squashfs:application/octet-stream image.json:application/json \
            SHA256SUMS:text/plain > ../oras-push.json
          digest="$(jq -r .digest ../oras-push.json)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$OCI_REPO@$digest" > ../live-image-oci.txt
          echo "published $OCI_REPO:${TAG#v} = $digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the OCI artifact
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.OCI_REPO }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true
      - name: Attach the artifact reference to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 30); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 20; done
          cp dist/image-amd64/SHA256SUMS dist/live-image-SHA256SUMS
          gh release upload "$TAG" --clobber dist/live-image-oci.txt dist/live-image-SHA256SUMS

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: live-image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: live-image/go.mod
          cache-dependency-path: live-image/go.sum

      - uses: extractions/setup-just@v3

      - name: QEMU + KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 e2fsprogs fdisk >/dev/null
          # GitHub-hosted Linux runners expose /dev/kvm; open it to the runner user.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: End-to-end test on OpenWRT
        run: just e2e

      - name: VM logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iotgw-e2e-logs
          include-hidden-files: true # the harness works in test/qemu/.work
          path: |
            live-image/test/qemu/.work/*.serial.log
            live-image/test/qemu/.work/fakeapi.log
