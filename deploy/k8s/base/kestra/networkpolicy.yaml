# NetworkPolicy for the Kestra Postgres (CVE-2026-116328 hardening).
#
# Only the Kestra server (ns kestra, label app.kubernetes.io/name=kestra) may
# reach kestra-postgres:5432. Every other pod in the cluster, and the
# Kestra-spawned Ansible runner pods (app.kubernetes.io/managed-by=kestra), is
# denied: the runners never use the Kestra DB. This limits who can even try a
# PostgreSQL server-side bug that needs a DB login.
#
# Enforced by Canal on OVH MKS and by kindnet on kind (see the KMS policy note
# in deploy/k8s/base/kms/networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kestra-postgres
  labels:
    app.kubernetes.io/name: kestra-postgres
    app.kubernetes.io/part-of: iotgw-ng
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kestra-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kestra
      ports:
        - protocol: TCP
          port: 5432
