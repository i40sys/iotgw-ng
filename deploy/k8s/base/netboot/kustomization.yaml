apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OVH netboot (task-149.02): the iPXE menu + the CI-built live image. The
# overlay pins LIVE_IMAGE_REF to the image's OCI digest (release asset
# live-image-oci.txt); the base value makes the init container fail on purpose.
resources:
  - namespace.yaml
  - netboot.yaml
configMapGenerator:
  - name: netboot-menu
    namespace: netboot
    files:
      - menu.ipxe
