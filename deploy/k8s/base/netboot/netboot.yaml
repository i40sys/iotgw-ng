apiVersion: apps/v1
kind: Deployment
metadata:
  name: netboot
  namespace: netboot
  labels:
    app.kubernetes.io/name: netboot
    app.kubernetes.io/part-of: iotgw-ng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netboot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netboot
        app.kubernetes.io/part-of: iotgw-ng
    spec:
      initContainers:
        # Pull the CI-built live image BY DIGEST and verify every file against
        # the SHA256SUMS inside the artifact before nginx may serve it.
        - name: fetch-live-image
          image: ghcr.io/oras-project/oras:v1.3.4@sha256:f7bc056d54d97baa399414ed5048ecc67c3371b750d4bbce1d871827a5758179
          command: ["sh", "-ec"]
          args:
            - |
              case "$LIVE_IMAGE_REF" in *@sha256:*) ;; *) echo "LIVE_IMAGE_REF must be pinned by digest" >&2; exit 1 ;; esac
              oras pull "$LIVE_IMAGE_REF" -o /www/iotgw-live
              cd /www/iotgw-live && sha256sum -c SHA256SUMS
          env:
            - name: LIVE_IMAGE_REF
              value: "unset"
          volumeMounts:
            - { name: www, mountPath: /www }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      containers:
        - name: nginx
          image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /menu.ipxe, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: www, mountPath: /usr/share/nginx/html/iotgw-live, subPath: iotgw-live, readOnly: true }
            - { name: menu, mountPath: /usr/share/nginx/html/menu.ipxe, subPath: menu.ipxe, readOnly: true }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: www
          emptyDir: { sizeLimit: 2Gi }
        - name: menu
          configMap: { name: netboot-menu }
---
apiVersion: v1
kind: Service
metadata:
  name: netboot
  namespace: netboot
  labels:
    app.kubernetes.io/name: netboot
    app.kubernetes.io/part-of: iotgw-ng
spec:
  selector:
    app.kubernetes.io/name: netboot
  ports:
    - { name: http, port: 80, targetPort: http }
