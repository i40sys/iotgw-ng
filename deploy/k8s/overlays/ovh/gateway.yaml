# Public edge for iotgw-ng on OVH (task-142). The cluster's Traefik (managed in
# ~/k8s, Gateway API only, LB 145.239.127.187) serves this dedicated Gateway next
# to its own `traefik/default-gateway`; iotgw owns only what is in this file.
#
#   iotgw.i40sys.com          -> iotgw-ui-frontend:80   (SPA)
#   backend.iotgw.i40sys.com  -> iotgw-ui-backend:4444  (tRPC + WS)
#   api.iotgw.i40sys.com      -> kong:8000              (Supabase API, operator login)
#   device.iotgw.i40sys.com   -> kong:8000 /functions/v1/{vpn,ssh-ca} only
#   netboot.iotgw.i40sys.com  -> netboot:80 (iPXE menu + CI-built live image,
#                                task-149.02) — HTTP and HTTPS, no redirect
#   kestra.iotgw.i40sys.com   -> kestra.kestra:8080 (UI + API for operators;
#                                Kestra basic auth on every API call). Also
#                                kestra.145-239-127-187.sslip.io (public wildcard DNS for
#                                the LB IP) while the i40sys.com record is
#                                missing (Cloudflare token rejected 2026-10-06).
#
# The first three use Let's Encrypt (HTTP-01 solved through default-gateway's
# port-80 listener). The DEVICE host is served with a certificate from the
# device-API CA that gateways pin (decision-035) — Terraform issues it into the
# `device-api-tls` Secret here, so it is not a cert-manager Certificate.
apiVersion: v1
kind: Namespace
metadata:
  name: iotgw-gateway
  labels:
    app.kubernetes.io/part-of: iotgw-ng
---
# No ACME contact email on purpose (optional for Let's Encrypt).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-iotgw
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-iotgw-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: default-gateway
                namespace: traefik
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: iotgw-public
  namespace: iotgw-gateway
spec:
  secretName: iotgw-public-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-iotgw
  dnsNames:
    - iotgw.i40sys.com
    - backend.iotgw.i40sys.com
    - api.iotgw.i40sys.com
    - netboot.iotgw.i40sys.com
---
# Kestra gets its own certificate so an issuance problem on this host can never
# hold back the renewal of the shared one above.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: iotgw-kestra
  namespace: iotgw-gateway
spec:
  secretName: iotgw-kestra-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-iotgw
  dnsNames:
    - kestra.iotgw.i40sys.com
---
# Temporary: the sslip.io name, own certificate, until the i40sys.com record exists.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: iotgw-kestra-sslip
  namespace: iotgw-gateway
spec:
  secretName: iotgw-kestra-sslip-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-iotgw
  dnsNames:
    - kestra.145-239-127-187.sslip.io
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: iotgw
  namespace: iotgw-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: app
      hostname: iotgw.i40sys.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: iotgw-public-tls }]
      allowedRoutes: { namespaces: { from: All } }
    - name: backend
      hostname: backend.iotgw.i40sys.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: iotgw-public-tls }]
      allowedRoutes: { namespaces: { from: All } }
    - name: api
      hostname: api.iotgw.i40sys.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: iotgw-public-tls }]
      allowedRoutes: { namespaces: { from: All } }
    - name: netboot
      hostname: netboot.iotgw.i40sys.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: iotgw-public-tls }]
      allowedRoutes: { namespaces: { from: All } }
    - name: kestra
      hostname: kestra.iotgw.i40sys.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: iotgw-kestra-tls }]
      allowedRoutes: { namespaces: { from: All } }
    - name: kestra-sslip
      hostname: kestra.145-239-127-187.sslip.io
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: iotgw-kestra-sslip-tls }]
      allowedRoutes: { namespaces: { from: All } }
    - name: device
      hostname: device.iotgw.i40sys.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: device-api-tls }]
      allowedRoutes: { namespaces: { from: All } }
---
# Plain HTTP on iotgw hosts -> HTTPS (on default-gateway's shared :80 listener;
# the more specific ACME solver routes still win for /.well-known/acme-challenge).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iotgw-https-redirect
  namespace: iotgw-gateway
spec:
  parentRefs:
    - { name: default-gateway, namespace: traefik, sectionName: http }
  hostnames:
    - iotgw.i40sys.com
    - backend.iotgw.i40sys.com
    - api.iotgw.i40sys.com
    - device.iotgw.i40sys.com
    - kestra.iotgw.i40sys.com
    - kestra.145-239-127-187.sslip.io
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iotgw-ui-frontend
  namespace: iotgw-ui
spec:
  parentRefs:
    - { name: iotgw, namespace: iotgw-gateway, sectionName: app }
  hostnames: [iotgw.i40sys.com]
  rules:
    - backendRefs: [{ name: iotgw-ui-frontend, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iotgw-ui-backend
  namespace: iotgw-ui
spec:
  parentRefs:
    - { name: iotgw, namespace: iotgw-gateway, sectionName: backend }
  hostnames: [backend.iotgw.i40sys.com]
  rules:
    - backendRefs: [{ name: iotgw-ui-backend, port: 4444 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kong
  namespace: supabase-app
spec:
  parentRefs:
    - { name: iotgw, namespace: iotgw-gateway, sectionName: api }
  hostnames: [api.iotgw.i40sys.com]
  rules:
    - backendRefs: [{ name: kong, port: 8000 }]
---
# Only the two device endpoints (decision-035), as the kind device-api Ingress.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: device-api
  namespace: supabase-app
spec:
  parentRefs:
    - { name: iotgw, namespace: iotgw-gateway, sectionName: device }
  hostnames: [device.iotgw.i40sys.com]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /functions/v1/vpn }
        - path: { type: PathPrefix, value: /functions/v1/ssh-ca }
      backendRefs: [{ name: kong, port: 8000 }]
---
# iPXE menu + live image (task-149.02). Served over plain HTTP too (no
# redirect): the sites' firmware iPXE has no HTTPS support yet, so it chains
# http://netboot.iotgw.i40sys.com/menu.ipxe directly. HTTPS stays available
# (the CI chainloader uses it); the squashfs itself is fetched over HTTPS by the
# image's initrd (curl + CA bundle), see menu.ipxe.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netboot
  namespace: netboot
spec:
  parentRefs:
    - { name: iotgw, namespace: iotgw-gateway, sectionName: netboot }
    - { name: default-gateway, namespace: traefik, sectionName: http }
  hostnames: [netboot.iotgw.i40sys.com]
  rules:
    - backendRefs: [{ name: netboot, port: 80 }]
---
# Kestra UI + API for operators. Kestra's basic auth guards the API (the UI
# shell is a static login page); never route this host without it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kestra
  namespace: kestra
spec:
  parentRefs:
    - { name: iotgw, namespace: iotgw-gateway, sectionName: kestra }
    - { name: iotgw, namespace: iotgw-gateway, sectionName: kestra-sslip }
  hostnames: [kestra.iotgw.i40sys.com, kestra.145-239-127-187.sslip.io]
  rules:
    - backendRefs: [{ name: kestra, port: 8080 }]
