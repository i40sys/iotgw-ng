apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: iotgw-release
    namespace: iotgw-ui
    files:
      - manifest.json=release-manifest.json
    options:
      disableNameSuffixHash: true

# OVH Managed Kubernetes `ymbihq` (GRA9) — the real environment (task-142).
# Applied by Terraform (deploy/terraform/ovh/platform), never by hand.
# Differences from kind:
#   - public hostnames under iotgw.i40sys.com, served by the cluster's existing
#     Traefik (Gateway API, LB 145.239.127.187) — the base ingress-nginx Ingresses
#     are dropped and replaced by gateway.yaml (own Gateway + HTTPRoutes);
#   - custom images pulled from ghcr.io/i40sys pinned by digest (decision-021);
#   - PVCs use the cluster default class (csi-cinder-high-speed-gen2).
# NO global namespace transformer (decision-020).
resources:
  - ../../base
  - ../../base/supabase-db-stackgres
  - ../../base/supabase-app
  - ../../base/iotgw-ui
  - ../../base/netboot
  - gateway.yaml

# Frontend bakes VITE_API_URL / VITE_SUPABASE_URL: it must be the OVH build
# (backend.iotgw.i40sys.com / api.iotgw.i40sys.com), not the prod-sketch one.
images:
  - name: supabase/edge-runtime:v1.74.0
    newName: ghcr.io/i40sys/iotgw-functions
    digest: sha256:6db2b8ddc6f800fd469644363cb9eeaba21f32329470e3aa5ebd71eac9305e92
  - name: iotgw-ui-backend
    newName: ghcr.io/i40sys/iotgw-ui-backend
    digest: sha256:090f7212eb2acb5c0fba1e1469b42977dfc14a6ca8a128e0d13a86e9869a3994
  - name: iotgw-ui-frontend
    newName: ghcr.io/i40sys/iotgw-ui-frontend
    digest: sha256:432c29a5dbd9ecfcfe1bd159200747fcb0b463053d8094f5290b09702dee4393

patches:
  # CI-built live image served by the netboot (task-149.02): the OCI artifact
  # of a release, BY DIGEST (release asset live-image-oci.txt).
  - target: { kind: Deployment, name: netboot }
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/env/0/value
        value: ghcr.io/i40sys/iotgw-live-image@sha256:91408278f22b66e7c24defb25e05fbcac1c5f4a651dabeb3c7603e3640d8b00e # v0.6.0
      # ipxe-local.efi ("Boot from local disk" on UEFI): a release asset, pinned
      # by its SHA256 (release asset chainloader-SHA256SUMS).
      - op: replace
        path: /spec/template/spec/initContainers/1/env/0/value
        value: https://github.com/i40sys/iotgw-ng/releases/download/v0.6.2/ipxe-local.efi
      - op: replace
        path: /spec/template/spec/initContainers/1/env/1/value
        value: 3f97011772d25efa762fafc6451b742bc4c29146baf717809750aaf99cc494f5 # v0.6.2
  # Baked-in /home/deno/functions instead of the base emptyDir placeholder.
  - target:
      kind: Deployment
      name: functions
    patch: |-
      - op: remove
        path: /spec/template/spec/volumes
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts
  - target:
      kind: Deployment
      name: iotgw-ui-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: iotgw-ui-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # GoTrue's public URLs (password login only, but keep redirects/links right).
  - target: { kind: Deployment, name: auth }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: auth }
      spec:
        template:
          spec:
            containers:
              - name: auth
                env:
                  - name: API_EXTERNAL_URL
                    value: https://api.iotgw.i40sys.com
                  - name: GOTRUE_SITE_URL
                    value: https://iotgw.i40sys.com

  # No ingress-nginx on this cluster: Traefik HTTPRoutes (gateway.yaml) instead.
  - target: { kind: Ingress, name: kong }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: { name: kong }
  - target: { kind: Ingress, name: device-api }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: { name: device-api }
  - target: { kind: Ingress, name: iotgw-ui-frontend }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: { name: iotgw-ui-frontend }
  - target: { kind: Ingress, name: iotgw-ui-backend }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: { name: iotgw-ui-backend }
